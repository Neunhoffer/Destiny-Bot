name: desktop

# Builds the Athena desktop app: a Windows installer on every change to the app,
# and a macOS .dmg on demand. Tags v* attach the installers to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bundle_kokoro:
        description: "Bundle the Kokoro voice pack too (the most natural voice; about 100 MB of the installer)"
        type: boolean
        default: true
      build_macos:
        description: "Also build the macOS app (.dmg)"
        type: boolean
        default: true
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "packaging/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write # to attach the installers to a release on tags

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false # let a running build finish; only the newest waiting run is kept

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ATHENA_BUNDLE_KOKORO: ${{ (github.event_name == 'workflow_dispatch' && !inputs.bundle_kokoro) && '0' || '1' }}

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache the bundled voices
        uses: actions/cache@v4
        with:
          path: packaging/build/voices
          key: athena-voices-kokoro${{ env.ATHENA_BUNDLE_KOKORO }}-v1

      - name: Install the build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Install Inno Setup 6
        run: choco upgrade innosetup -y --no-progress

      - name: Build, smoke-test (--self-test-quick) and make the installer
        run: python packaging/build.py

      - name: Install like a user would and check the shortcuts
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Athena-Setup-*.exe | Select-Object -First 1
          "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB"
          $log = Join-Path $env:RUNNER_TEMP 'athena-install.log'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "Setup failed with exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Athena\Athena.exe'
          if (-not (Test-Path $exe)) { Get-Content $log; throw 'Athena.exe was not installed' }
          $links = @(
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Athena.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'Athena.lnk')
          )
          foreach ($link in $links) {
            if (-not (Test-Path $link)) { throw "Missing shortcut: $link" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
            "Shortcut $link -> $target"
            if ($target -ne $exe) { throw "The shortcut points to $target" }
          }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { $_.GetValue('DisplayName') -eq 'Athena' }
          if (-not $entry) { throw 'Athena is missing from Apps & features' }
          "Apps & features: $($entry.GetValue('DisplayName')) $($entry.GetValue('DisplayVersion'))"

      - name: Run the installed app's full self-test
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Athena\Athena.exe'
          $env:DESTINY_HOME = Join-Path $env:RUNNER_TEMP 'installed-self-test'
          $t = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content (Join-Path $env:DESTINY_HOME 'logs\self-test.txt')
          Copy-Item (Join-Path $env:DESTINY_HOME 'logs\self-test.json') dist\self-test-windows-installed.json
          python -c "import json, sys; r = json.load(open(sys.argv[1], encoding='utf-8')); print(json.dumps({k: r.get(k) for k in ('synthesis', 'window', 'environment')}, indent=1))" dist\self-test-windows-installed.json
          if ($t.ExitCode -ne 0) { throw "The installed app's self-test failed ($($t.ExitCode))" }

      - name: Open the app window, open it again, close both
        run: python packaging/check_window.py "$env:LOCALAPPDATA\Programs\Athena\Athena.exe" --screenshot dist/athena-window-windows.png --print-screenshot

      - name: Uninstall
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Athena'
          $exe = Join-Path $app 'Athena.exe'
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'Uninstalling left Athena.exe behind' }
          foreach ($link in @((Join-Path ([Environment]::GetFolderPath('Desktop')) 'Athena.lnk'), (Join-Path ([Environment]::GetFolderPath('Programs')) 'Athena.lnk'))) {
            if (Test-Path $link) { throw "Uninstalling left $link behind" }
          }
          'Uninstalled cleanly.'

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Athena-Setup-windows
          path: dist/Athena-Setup-*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload the self-test reports and the window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-windows-self-test
          path: |
            dist/self-test-*.json
            dist/athena-window-*.png
          if-no-files-found: warn

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Athena-Setup-*.exe
            dist/self-test-windows*.json

  macos-app:
    name: macOS app
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache the bundled voices
        uses: actions/cache@v4
        with:
          path: packaging/build/voices
          key: athena-voices-kokoro${{ env.ATHENA_BUNDLE_KOKORO }}-v1

      - name: Install the build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build, smoke-test and make the .dmg
        run: python packaging/build.py

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Athena-macos
          path: dist/Athena-*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athena-macos-self-test
          path: dist/self-test-*.json
          if-no-files-found: warn
