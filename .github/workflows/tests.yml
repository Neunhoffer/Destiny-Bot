name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false # let a running build finish; only the newest waiting run is kept

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_VOICES: ${{ github.workspace }}/packaging/build/test-voices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install espeak-ng, Tesseract and ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng tesseract-ocr ffmpeg

      - name: Install Destiny Bot with every extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # A real Piper voice, so the real-synthesis tests and the self-test can use it.
      - name: Cache the test voice
        uses: actions/cache@v4
        with:
          path: ${{ env.TEST_VOICES }}
          key: test-voice-piper-en_US-lessac-medium-v1

      - name: Download the test voice
        shell: python
        run: |
          import os
          from pathlib import Path
          from destiny_bot.tts.catalog import download_piper_voice
          path = download_piper_voice("en_US-lessac-medium", voices_dir=Path(os.environ["TEST_VOICES"]) / "piper")
          print(path, path.stat().st_size)

      - name: Run the tests
        env:
          DESTINY_TEST_PIPER_VOICE: ${{ env.TEST_VOICES }}/piper/en_US-lessac-medium.onnx
        run: python -m pytest -m "not e2e" -ra --durations=20

      # Which voices does this machine have, and how fast is each engine? (SAPI on Windows)
      - name: Self-test
        if: always()
        env:
          DESTINY_HOME: ${{ runner.temp }}/athena-self-test
          DESTINY_EXTRA_VOICE_DIRS: ${{ env.TEST_VOICES }}
        run: python -m destiny_bot self-test

      - name: Show the voice timings and Windows voices
        if: always()
        shell: python
        env:
          DESTINY_HOME: ${{ runner.temp }}/athena-self-test
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ["DESTINY_HOME"]) / "logs" / "self-test.json"
          if path.is_file():
              report = json.loads(path.read_text(encoding="utf-8"))
              keys = ("synthesis", "windows_voices", "window")
              print(json.dumps({k: report.get(k) for k in keys if k in report}, indent=1))

      # Temporary: why does SAPI (through pyttsx3) give an empty WAV here? Each probe runs
      # in its own process with a time limit, since SAPI calls can hang.
      - name: Windows speech diagnostics
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 10
        shell: python
        run: |
          import subprocess, sys, tempfile, textwrap, wave
          from pathlib import Path
          tmp = Path(tempfile.mkdtemp())
          text = "Hello from Athena. This is a test of the Windows voice."
          def describe(path):
              if not path.exists():
                  return "no file"
              data = path.read_bytes()
              try:
                  with wave.open(str(path)) as w:
                      return (f"{len(data)} bytes, {w.getframerate()} Hz, {w.getsampwidth() * 8}-bit, "
                              f"{w.getnframes() / w.getframerate():.2f} s")
              except Exception as exc:
                  return f"{len(data)} bytes, not readable as WAV ({exc}); starts {data[:48]!r}"
          probes = {
              "pyttsx3 save_to_file, main thread": """
                  import pyttsx3
                  e = pyttsx3.init("sapi5"); e.save_to_file(TEXT, OUT); e.runAndWait()
              """,
              "pyttsx3 save_to_file, worker thread with CoInitialize (like Athena)": """
                  import threading, pythoncom, pyttsx3
                  def work():
                      pythoncom.CoInitialize()
                      e = pyttsx3.init("sapi5"); e.save_to_file(TEXT, OUT); e.runAndWait()
                  t = threading.Thread(target=work); t.start(); t.join()
              """,
              "SpVoice + SpFileStream, default format": """
                  import comtypes.client
                  v = comtypes.client.CreateObject("SAPI.SpVoice"); s = comtypes.client.CreateObject("SAPI.SpFileStream")
                  from comtypes.gen import SpeechLib
                  s.Open(OUT, SpeechLib.SSFMCreateForWrite); v.AudioOutputStream = s; v.Speak(TEXT); s.Close()
              """,
              "SpVoice + SpFileStream, 22 kHz 16-bit mono": """
                  import comtypes.client
                  v = comtypes.client.CreateObject("SAPI.SpVoice"); s = comtypes.client.CreateObject("SAPI.SpFileStream")
                  from comtypes.gen import SpeechLib
                  s.Format.Type = SpeechLib.SAFT22kHz16BitMono
                  s.Open(OUT, SpeechLib.SSFMCreateForWrite); v.AudioOutputStream = s; v.Speak(TEXT); s.Close()
              """,
              "PowerShell System.Speech SetOutputToWaveFile": """
                  import subprocess
                  script = ("Add-Type -AssemblyName System.Speech; $s = New-Object System.Speech.Synthesis.SpeechSynthesizer; "
                            "$s.SetOutputToWaveFile('" + OUT + "'); $s.Speak('" + TEXT + "'); $s.Dispose()")
                  subprocess.run(["powershell", "-NoProfile", "-Command", script], check=True, timeout=50)
              """,
              "Athena SystemEngine().synthesize": """
                  from destiny_bot.tts.system_engine import SystemEngine
                  open(OUT, "wb").write(SystemEngine().synthesize(TEXT).data)
              """,
          }
          for index, (name, code) in enumerate(probes.items()):
              out = tmp / f"probe{index}.wav"
              program = f"TEXT = {text!r}\nOUT = {str(out)!r}\n" + textwrap.dedent(code)
              try:
                  r = subprocess.run([sys.executable, "-c", program], capture_output=True, text=True, timeout=60)
                  status = f"exit {r.returncode}" + (f" ({r.stderr.strip().splitlines()[-1]})" if r.returncode and r.stderr.strip() else "")
              except subprocess.TimeoutExpired:
                  status = "HUNG, killed after 60 s"
              print(f"{name}: {status}; {describe(out)}", flush=True)

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ runner.os }}
          path: ${{ runner.temp }}/athena-self-test/logs/
          if-no-files-found: warn
