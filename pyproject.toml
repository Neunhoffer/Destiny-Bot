[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-reader"
version = "0.1.0"
description = "A private, offline-first study reader that reads textbooks and class materials aloud."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "lameenc>=1.7",
]

[project.optional-dependencies]
# Natural-sounding neural voices that run 100% offline (recommended).
piper = ["piper-tts>=1.3"]
# Windows/macOS/Linux system voices through the OS speech engine.
system = ["comtypes>=1.2; sys_platform == 'win32'"]
# Microsoft Edge online neural voices (sends text to Microsoft; off by default).
edge = ["edge-tts>=6.1"]
# Claude-powered study helpers (sends text to Anthropic; off by default).
ai = ["anthropic>=1.0"]
# Read scanned pages and photos of handouts (also needs the Tesseract program).
ocr = ["pytesseract>=0.3.10", "pillow>=10"]
# Kokoro: the most natural offline voices (the voice pack is a separate ~120 MB download).
kokoro = ["kokoro-onnx>=0.6"]
# Open the reader in its own window instead of a browser tab (`athena app`).
app = ["pywebview>=5.0"]
all = ["athena-reader[piper,kokoro,system,edge,ai,ocr,app]"]
dev = ["athena-reader[all]", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "playwright>=1.44"]
# Build the desktop app and its installer (see packaging/README.md).
build = ["athena-reader[all]", "pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
athena = "athena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
athena = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: takes more than a few seconds",
  "e2e: drives the web UI in a real browser",
]
